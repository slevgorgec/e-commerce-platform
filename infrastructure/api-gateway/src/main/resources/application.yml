# Config-server'dan alınan konfigürasyonun yerel fallback'i
server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**, /api/users/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**, /api/categories/**

        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/cart/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**

jwt:
  secret: ${JWT_SECRET:bG9jYWwtZGV2LXNlY3JldC1rZXktbXVzdC1iZS1jaGFuZ2VkLWluLXByb2R1Y3Rpb24tbWluLTI1Ni1iaXRz}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.n11bootcamp.ecommerce: DEBUG
    org.springframework.cloud.gateway: DEBUG
